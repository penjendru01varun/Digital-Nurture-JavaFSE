<h1>Reactive Enrollment</h1><form [formGroup]="enrollForm" (ngSubmit)="submit()"><input formControlName="studentName" placeholder="Name"><input formControlName="studentEmail" placeholder="Email"><span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email taken</span><input formControlName="courseId" placeholder="Course code"><span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span><select formControlName="preferredSemester"><option>Odd</option><option>Even</option></select><label><input type="checkbox" formControlName="agreeToTerms"> Agree to terms</label><div formArrayName="additionalCourses"><div *ngFor="let ctrl of additionalCourses.controls; let i = index"><input [formControl]="ctrl"><button type="button" (click)="removeCourse(i)">Remove</button></div></div><button type="button" (click)="addCourse()">Add Another Course</button><button [disabled]="enrollForm.invalid">Submit</button></form>
